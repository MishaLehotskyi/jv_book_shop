databaseChangeLog:
  - changeSet:
      id: 10-create-books-categories-table
      author: MishaLehotskyi
      changes:
        - createTable:
            tableName: books_categories
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_books_categories_book
                    references: books(id)
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_books_categories_category
                    references: categories(id)
